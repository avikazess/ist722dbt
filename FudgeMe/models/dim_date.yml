version: 2

models:
  - name: dim_date
    description: Conformed Date Dimension. One row per day of the year.
    columns:
      - name: date_key 
        data_type: int 
        description: The surrogate key of the date YYYYMMDD
        tests:
          - not_null
          - unique
      - name: full_date
        description: The date of the date key
        tests:
          - not_null
      - name: day_name
        description: The day of the date key
        tests:
          - not_null
      - name: month_name
        description: The month of the date key
        tests:
          - not_null
      - name: quarter
        description: Q1-Q4
        tests:
          - not_null
      - name: year
        description: year in a timestamp
        tests:
          - not_null
      - name: is_weekday
        description: yes or no
        tests:
          - not_null





